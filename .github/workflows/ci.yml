name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LICENSE is MIT
        run: |
          if [ ! -f LICENSE ]; then
            echo "LICENSE file is missing"
            exit 1
          fi
          if ! grep -q "MIT License" LICENSE; then
            echo "LICENSE is not MIT"
            exit 1
          fi
          if ! grep -q "Copyright (c) 2026 CloudGrid Inc." LICENSE; then
            echo "COPYRIGHT holder is wrong or missing"
            exit 1
          fi
          echo "LICENSE is MIT with correct copyright holder"

  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Lint SKILL.md frontmatter
        run: node .github/scripts/lint-skills.mjs

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # plugin.json is the single source of truth; VERSION and package.json
      # mirror it. VERSION is read at runtime by hooks/user-prompt and reported
      # as plugin_version in telemetry, so drift there corrupts release data.
      - name: Version coherence (plugin.json / VERSION / package.json)
        run: node .github/scripts/check-versions.mjs

  corpus-tool-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Corpus edition-safety (shared-14 tool names only)
        run: node .github/scripts/corpus-tool-names.mjs

  content-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Behavioral content checks: every cloudgrid.yaml example in the skills
      # obeys the platform contract (path is a URL mount, needs vocabulary,
      # service types, cron shape), the load-bearing teaching lines are
      # present, and retired names / stale-CLI footguns stay out.
      - name: Content evals (yaml contract + load-bearing lines)
        run: |
          npm install --no-save yaml
          node .github/scripts/eval-content.mjs

  bootstrap-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Bootstrap sentence hash is locked
        run: node bin/bootstrap-hash.test.mjs

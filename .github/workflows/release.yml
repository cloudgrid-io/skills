name: release

# The npm channel is RETIRED (last publish: 0.14.0, 2026-07-09).
#
# Every documented way to install these skills reads the GIT REPO, not npm:
#   - Claude Code:  /plugin marketplace add cloudgrid-io/skills
#   - gh extension: gh skill install cloudgrid-io/skills
#   - Cursor/Cline/Gemini/Codex: npx skills add cloudgrid-io/skills
#     (the third-party `skills` CLI reading THIS REPO — not
#      `npm install @cloudgrid-io/skills`)
#
# So skills ship by MERGING TO MAIN; there is nothing to publish. package.json
# is `private: true` and this workflow no longer runs `npm publish` — it only
# cuts a GitHub release when a v* tag is pushed, for marking milestones.
#
# To revive the npm channel: drop `private` from package.json, configure a
# trusted publisher for the package on npmjs.com FIRST, then add a publish step
# modelled on cloudgrid-io/mcp's .github/workflows/release.yml — do not restate
# its steps here, since two copies of a publish recipe are how the last note
# went stale. That workflow is the reference for all of it: `id-token: write`
# (mcp release.yml:10), a pinned `npm install -g npm@<version >= 11.5.1>`
# (mcp:21-24), and `npm publish --provenance --access public` with no stored
# token (mcp:30).
#
# The npm-version pin is the part that bites if omitted: OIDC trusted publishing
# needs npm >= 11.5.1, but actions/setup-node with Node 22 ships 10.9.8. Without
# the pinned upgrade the publish does not fail loudly — it silently falls back to
# looking for a stored token, so a reader lands on the token path by default.
#
# Keep package.json's version in lockstep with .claude-plugin/plugin.json — CI
# already enforces that they match (.github/scripts/check-versions.mjs).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # A tag must not disagree with the shipped version.
      - name: Version coherence
        run: node .github/scripts/check-versions.mjs
      - name: Tag matches plugin.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          shipped="$(node -e 'process.stdout.write(require("./.claude-plugin/plugin.json").version)')"
          if [ "$tag" != "$shipped" ]; then
            echo "Tag v${tag} does not match .claude-plugin/plugin.json (${shipped})."
            echo "Tag the release commit whose plugin.json matches, or bump plugin.json first."
            exit 1
          fi
          echo "Tag v${tag} matches plugin.json."
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
